name: bitewise
description: "BiteWise — Discover. Taste. Share. A premium food-focused social platform."
publish_to: "none"
version: 1.0.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Auth providers
  google_sign_in: ^6.2.1

  # Maps & location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1

  # Storage & media
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
