# Codemagic CI/CD — build & publish BiteWise without a local Mac.
#
# Full walkthrough: NO_MAC_RELEASE.md
#
# One-time Codemagic dashboard setup (https://codemagic.io):
#  1. Sign up with GitHub and connect this repository.
#  2. Teams → Integrations → App Store Connect: add an API key.
#     Name the integration exactly: bitewise_asc
#  3. Application settings → Environment variables:
#       MAPS_API_KEY          = your Google Maps API key (secret)
#       APP_STORE_APPLE_ID    = numeric Apple ID from App Store Connect
#         (App Information → Apple ID). Override the placeholder below.
#  4. In App Store Connect, create the app with bundle id
#     com.bitewise.bitewise (requires Apple Developer Program).
#
# ios-release: signs with automatic profiles, builds .ipa, uploads TestFlight.

workflows:
  ios-release:
    name: iOS App Store build
    max_build_duration: 90
    integrations:
      app_store_connect: bitewise_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bitewise.bitewise
      vars:
        # Replace in Codemagic UI (Application variables) — do not commit secrets.
        APP_STORE_APPLE_ID: "0000000000"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Inject Google Maps API key
        script: |
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "WARNING: MAPS_API_KEY is not set. Nearby map will not work."
            echo "Add it under Codemagic → Environment variables (group: maps)."
          else
            sed -i '' "s/YOUR_MAPS_API_KEY_HERE/${MAPS_API_KEY}/g" \
              ios/Runner/AppDelegate.swift \
              android/app/src/main/AndroidManifest.xml
            echo "Injected MAPS_API_KEY into iOS + Android manifests."
          fi
      - name: Set up code signing identities
        script: |
          xcode-project use-profiles
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive_log.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true in a follow-up commit when ready for App Review:
        submit_to_app_store: false

  android-release:
    name: Android Play Store build
    max_build_duration: 60
    environment:
      android_signing:
        - bitewise_keystore
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Inject Google Maps API key
        script: |
          if [ -n "${MAPS_API_KEY:-}" ]; then
            sed -i "s/YOUR_MAPS_API_KEY_HERE/${MAPS_API_KEY}/g" \
              android/app/src/main/AndroidManifest.xml
          fi
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Build app bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
