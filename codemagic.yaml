# Codemagic CI/CD — build & publish BiteWise without a local Mac.
#
# Full walkthrough: NO_MAC_RELEASE.md
#
# One-time Codemagic dashboard setup (https://codemagic.io):
#  1. Sign up with GitHub and connect this repository.
#  2. Teams → Integrations → App Store Connect: add an API key.
#     Name the integration exactly: bitewise_asc
#  3. Application settings → Environment variables:
#       APP_STORE_APPLE_ID    = numeric Apple ID from App Store Connect
#         (App Information → Apple ID). Override the placeholder below.
#  4. In App Store Connect, create the app with bundle id
#     com.amansaleem06.bitewise (requires Apple Developer Program).
#
# ios-release: signs with automatic profiles, builds .ipa, uploads TestFlight.

workflows:
  ios-release:
    name: iOS App Store build
    max_build_duration: 90
    integrations:
      app_store_connect: bitewise_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.amansaleem06.bitewise
      vars:
        # Replace in Codemagic UI (Application variables) — do not commit secrets.
        APP_STORE_APPLE_ID: "6800049991"
        # PLACES_API_KEY: set in Codemagic UI as a SECURE variable.
        # Never write the key into this file.
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing identities
        script: |
          xcode-project use-profiles
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Resolve next iOS build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Prefer App Store Connect over pubspec so uploads never collide
          # with a previously accepted CFBundleVersion (e.g. build 1).
          tf="$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || true)"
          as="$(app-store-connect get-latest-app-store-build-number \
            "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || true)"
          tf="${tf:-0}"
          as="${as:-0}"
          latest="$tf"
          if [ "$as" -gt "$latest" ]; then latest="$as"; fi
          # Floor at Codemagic project counter so UI-editor builds also advance.
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$latest" ]; then
            latest="$PROJECT_BUILD_NUMBER"
          fi
          NEXT_BUILD_NUMBER=$((latest + 1))
          if [ "$NEXT_BUILD_NUMBER" -lt 3 ]; then NEXT_BUILD_NUMBER=3; fi
          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"
          echo "Using CFBundleVersion=$NEXT_BUILD_NUMBER (TF=$tf AS=$as PROJECT=$PROJECT_BUILD_NUMBER)"
      - name: Build signed IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Building IPA with --build-name=1.0.0 --build-number=${NEXT_BUILD_NUMBER}"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="${NEXT_BUILD_NUMBER}" \
            --dart-define=PLACES_API_KEY="${PLACES_API_KEY:-}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive_log.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true in a follow-up commit when ready for App Review:
        submit_to_app_store: false

  android-release:
    name: Android Play Store build
    max_build_duration: 60
    environment:
      android_signing:
        - bitewise_keystore
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build app bundle
        script: |
          flutter build appbundle --release \
            --dart-define=PLACES_API_KEY="${PLACES_API_KEY:-}"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
